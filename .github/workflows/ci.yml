name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  test:
    name: Test + Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # the output bits are pinned (tests/cross_target_bits.rs): the same pins on Linux x86_64,
        # macOS aarch64 and Windows x86_64
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Analytic oracle
        run: cargo test --test analytic_oracle
      # clippy.toml bans the platform transcendentals and max / min / clamp; these pins catch a
      # target that still computes different bits (debug and release)
      # each run must print `pins compared: N` with N > 0 (the test asserts N is the pin count), so a
      # run that compared nothing cannot pass
      - name: Cross-target bit pins
        shell: bash
        run: |
          set -euo pipefail
          for profile in "" "--release"; do
            out=$(cargo test $profile --test cross_target_bits -- --nocapture 2>&1) || { echo "$out"; exit 1; }
            echo "$out" | grep -E '^test |pins compared'
            echo "$out" | grep -qE 'pins compared: [1-9][0-9]*[[:space:]]*$' || { echo "::error::no pins compared"; exit 1; }
          done

  wasm:
    name: Cross-target bit pins (wasm32-wasip1 via wasmtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      # dtolnay/rust-toolchain's `targets:` has silently skipped the rustup target add before; the
      # explicit call is idempotent
      - name: Ensure wasm32-wasip1 rust-std is installed
        run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-wasip1
      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
      # the same pins as the native lanes, debug and release; cargo runs the binary it just built
      # through the runner (no binary is picked from target/ by hand, so a stale one is never run);
      # `pins compared: N` with N > 0 required
      - name: Cross-target bit pins via wasmtime
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: |
          set -euo pipefail
          for flag in "" "--release"; do
            out=$(cargo test $flag --target wasm32-wasip1 --test cross_target_bits -- --nocapture 2>&1) || { echo "$out"; exit 1; }
            echo "$out" | grep -E 'Running|^test |pins compared'
            echo "$out" | grep -qE 'pins compared: [1-9][0-9]*[[:space:]]*$' || { echo "::error::no pins compared ($flag)"; exit 1; }
          done

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

