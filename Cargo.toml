[package]
name = "alice-audio"
version = "2.0.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
license = "LicenseRef-Proprietary"
publish = false
description = "General-purpose audio processing: FFT, filters, mixer, effects, waveform generation, sample rate conversion, ADSR envelope, ring buffer"

[lib]
crate-type = ["rlib"]

[dependencies]
# every transcendental and every f64 max / min / clamp goes through alice-det-math, so the output is a
# pure function of the input bits on every target (clippy.toml bans the platform functions)
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", branch = "main", version = "0.6", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[features]
# `renderImpact` for WebAssembly
wasm = ["dep:wasm-bindgen"]
